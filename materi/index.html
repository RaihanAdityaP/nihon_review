<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi · 日本語復習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=20261006">
<script>
  // Terapkan tema tersimpan sebelum render, biar tidak ada "flash" warna salah
  (function(){
    var saved = localStorage.getItem('nihongo_theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>
<script src="../assets/js/layout.js?v=20261006"></script>
<main>

<div id="pageMateri" class="page active">
    <div class="sec-title">Materi</div>
    <div class="sec-sub">Cari kana, romaji, kanji, atau arti — lintas semua kategori. (Hiragana/Katakana/Kanji &amp; Kata Kerja ada menu sendiri, lihat tab 文字 dan 動詞)</div>
    <div class="kamus-search-wrap">
      <input type="text" id="kamusSearchInput" class="kamus-search" placeholder="Cari kana, romaji, kanji, atau arti..." oninput="renderKamusResults(true)">
    </div>
    <div class="kamus-chips" id="kamusChips"></div>
    <div class="kamus-count" id="kamusCount"></div>
    <div id="kamusResults"></div>
  </div>

</main>
<script src="../assets/data.js?v=20261006"></script>
<script src="../assets/js/pager.js?v=20261006"></script>
<script src="../assets/js/notes.js?v=20261006"></script>
<script src="../assets/js/kamus-sheet.js?v=20261006"></script>
<script src="../assets/js/kamus-core.js?v=20261006"></script>
<script src="../assets/js/page-materi.js?v=20261006"></script>
<script>
renderKamusChips();
renderKamusResults();
</script>
</body>
</html>
